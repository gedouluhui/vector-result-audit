name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m unittest discover -s tests -v
      - run: python scripts/mutation_check.py
      - run: python -m scripts.build_demo --out docs/index.html --check
      - run: python -m build
      - run: python -c "import glob,subprocess,sys; subprocess.run([sys.executable,'scripts/smoke_wheel.py',*glob.glob('dist/*.whl')],check=True)"
      - name: Preserve real PASS FAIL ERROR evidence
        if: always()
        run: python scripts/ci_evidence.py --out ci-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: core-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14
  integrations:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r integrations/requirements.txt
      - run: python -m unittest discover -s integrations -v
      - name: Capture real engines with injected export defects
        if: always()
        run: python -m examples.engine_capture --out engine-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: engine-evidence-${{ matrix.os }}
          path: engine-evidence/
          if-no-files-found: error
          retention-days: 14
